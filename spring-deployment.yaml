apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app-deployment
  labels:
    app: my-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
      - name: my-app
        image: bilbadarryl081/spring-cicd-app:latest # 또는 특정 BUILD_NUMBER 태그
        imagePullPolicy: Always                 # 매번 최신 이미지를 가져오도록 설정
        ports:
        - containerPort: 8080                   # 애플리케이션 포트
---
apiVersion: v1
kind: Service
metadata:
  name: my-app-service
spec:
  type: NodePort                                # EC2 외부에서 접속 테스트용 (또는 ClusterIP + Ingress 사용)
  selector:
    app: my-app
  ports:
    - protocol: TCP
      port: 8080        # 클러스터 내부에서 이 Service의 ClusterIP를 통해 접근하는 포트
      targetPort: 8080  # 실제 트래픽이 도착할 Pod 내부 컨테이너의 포트 (Deployment의 containerPort와 일치해야 함)
      nodePort: 30080    # 각 Kubernetes 노드의 IP를 통해 외부에서 직접 접근하는 포트 (30000-32767 범위 내, 미지정 시 자동 할당).EC2 보안그룹에 해당 포트(30080) 개방 필요